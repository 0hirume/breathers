[package]
name = "breathers"
version = "0.4.4"
edition = "2024"
description = "Give rust code breathing room with automatic blank-line spacing"
repository = "https://github.com/0hirume/breathers"
license = "MIT"
keywords = ["formatter", "readability", "rust", "whitespace"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[dependencies]
clang = { version = "2.1.0", features = ["runtime"] }
clap = { version = "4.6.6", default-features = false, features = ["derive", "error-context", "help", "std", "usage"] }
console = { version = "0.16.6", default-features = false, features = ["std"] }
dirs = "7.0.0"
globset = { version = "0.4.20", default-features = false }
indicatif = { version = "0.18.6", default-features = false }
ra_ap_syntax = "0.0.351"
regex = { version = "1.13.1", default-features = false }
schemars = "1.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "1.2.0", default-features = false, features = ["deserialize"] }
tokio = { version = "1.53.1", features = ["io-std", "rt"] }
toml = { version = "1.1.5", default-features = false, features = ["parse", "serde", "std"] }
tower-lsp-server = "0.23.0"
tree-sitter = { version = "0.27.0", default-features = false }
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-javascript = "0.25.0"
tree-sitter-lua = "0.5.0"
tree-sitter-nu = { git = "https://github.com/nushell/tree-sitter-nu", rev = "64613ef22f4116862d7997939c8d1794ceb1f856", version = "0.0.1" }
tree-sitter-python = "0.25.0"
tree-sitter-typescript = "0.23.2"
vermis = "0.1.0"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
warnings = { level = "deny", priority = -1 }
