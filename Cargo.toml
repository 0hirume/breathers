[package]
name = "breathers"
version = "0.6.0"
edition = "2024"
description = "Give rust code breathing room with automatic blank-line spacing"
repository = "https://github.com/0hirume/breathers"
license = "MIT"
keywords = ["formatter", "readability", "rust", "whitespace"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[package.metadata.dist]
dist = true

[dependencies]
clap = { version = "4", features = ["derive", "error-context", "help", "std", "usage"] }
console = { version = "0.16", features = ["std"] }
dirs = "7"
globset = "0.4"
indicatif = "0.18"
ra_ap_syntax = "0.0"
rayon = "1"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1", features = ["parse", "serde", "std"] }
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-lua = "0.5"
tree-sitter-nu = { git = "https://github.com/nushell/tree-sitter-nu", rev = "4f577aaa735154f934594b598a69ed7b1b707cf6" }
tree-sitter-pwsh = "0.38"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
vermis = "0.7"

[lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

absolute_paths = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
arbitrary_source_item_ordering = "deny"
assertions_on_result_states = "deny"
branches_sharing_code = "deny"
clear_with_drain = "deny"
clone_on_ref_ptr = "deny"
collection_is_never_read = "deny"
dbg_macro = "deny"
debug_assert_with_mut_call = "deny"
definition_in_module_root = "deny"
derive_partial_eq_without_eq = "deny"
fallible_impl_from = "deny"
inline_modules = "deny"
let_underscore_must_use = "deny"
map_err_ignore = "deny"
multiple_inherent_impl = "deny"
needless_collect = "deny"
needless_pass_by_ref_mut = "deny"
redundant_clone = "deny"
redundant_test_prefix = "deny"
redundant_type_annotations = "deny"
self_named_module_files = "deny"
single_char_lifetime_names = "deny"
unneeded_field_pattern = "deny"
unused_result_ok = "deny"
unused_trait_names = "deny"
use_self = "deny"
verbose_file_reads = "deny"

[lints.rust]
deprecated_safe = { level = "deny", priority = -1 }
let_underscore = { level = "deny", priority = -1 }
rust_2018_idioms = { level = "deny", priority = -1 }
unsafe_code = "deny"
unused = { level = "deny", priority = -1 }
warnings = { level = "deny", priority = -1 }

missing_docs = "deny"
unreachable_pub = "deny"
unsafe_op_in_unsafe_fn = "deny"

[profile.dist]
inherits = "release"
lto = "thin"
