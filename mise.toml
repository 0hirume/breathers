[tasks.check]
description = "check formatting, lints, and tests"
run = ["cargo fmt --check", "cargo clippy --all-targets --locked", "cargo test --locked"]

[tasks.build]
description = "build the release binary"
run = "cargo build --release --locked"

[tools]
"aqua:tombi-toml/tombi" = "latest"
"github:llvm/llvm-project" = "latest"
"npm:oxfmt" = "latest"
rust = { version = "nightly", profile = "minimal", components = ["rust-analyzer", "rustfmt", "clippy"] }
