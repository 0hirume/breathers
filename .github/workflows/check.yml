name: check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  RUSTUP_TOOLCHAIN: nightly

jobs:
  check:
    runs-on: ${{ matrix.system }}
    strategy:
      matrix:
        system:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: set up rust
        run: rustup toolchain install nightly --profile minimal --component rustfmt --component clippy

      - name: install libclang
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev

      - name: update libclang
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade llvm --yes
          "LIBCLANG_PATH=$env:ProgramFiles\LLVM\bin" >> $env:GITHUB_ENV

      - name: check formatting, lints, and tests
        shell: bash
        run: |
          cargo fmt --check
          cargo clippy --all-targets --locked
          cargo test --locked
