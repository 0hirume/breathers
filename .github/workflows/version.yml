name: version

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: version-${{ github.ref }}
  queue: max

jobs:
  release:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: set up release-plz
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: aqua:release-plz/release-plz
          cache: false

      - name: create release token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_CLIENT_IDENTIFIER }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: read

      - name: configure git author
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

      - name: create version tag
        run: release-plz release
        env:
          GIT_TOKEN: ${{ steps.token.outputs.token }}

  prepare:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: set up release-plz
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: aqua:release-plz/release-plz
          cache: false

      - name: create preparation token
        id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510
        with:
          client-id: ${{ vars.RELEASE_CLIENT_IDENTIFIER }}
          private-key: ${{ secrets.RELEASE_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: configure git author
        uses: release-plz/git-config@59144859caf016f8b817a2ac9b051578729173c4
        env:
          GITHUB_TOKEN: ${{ steps.token.outputs.token }}

      - name: prepare version pull request
        run: release-plz release-pr
        env:
          GIT_TOKEN: ${{ steps.token.outputs.token }}
