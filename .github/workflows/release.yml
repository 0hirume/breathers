name: release

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  plan:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: set up dist
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: aqua:axodotdev/cargo-dist
          cache: false

      - name: set up nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c
        with:
          check-latest: true

      - name: plan release
        id: plan
        run: nu scripts/release.nu plan

  build:
    needs: plan
    if: github.event_name == 'push'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      RUSTUP_TOOLCHAIN: nightly
      TARGET: ${{ matrix.target }}
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: set up rust
        run: rustup toolchain install nightly --profile minimal

      - name: set up dist
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: aqua:axodotdev/cargo-dist
          cache: false

      - name: set up nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c
        with:
          check-latest: true

      - name: build archive
        id: artifacts
        run: nu scripts/release.nu archive

      - name: upload archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: archive-${{ matrix.target }}
          path: ${{ steps.artifacts.outputs.paths }}
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: set up dist
        uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550
        with:
          install_args: aqua:axodotdev/cargo-dist
          cache: false

      - name: set up nushell
        uses: hustcer/setup-nu@eacad52a4634c4f8d17a94916f93be6856861b9c
        with:
          check-latest: true

      - name: download archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: archive-*
          path: target/distrib
          merge-multiple: true

      - name: build checksums
        run: nu scripts/release.nu package

      - name: publish release
        run: nu scripts/release.nu publish

  assets:
    needs: publish
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/assets.yml
    with:
      tag: ${{ github.ref_name }}
